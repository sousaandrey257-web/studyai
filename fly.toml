# ============================================================
#  StudyAI — Fly.io configuration
#  Deploy: fly launch (first time) | fly deploy (updates)
# ============================================================

app      = "studyai"
primary_region = "cdg"  # Paris — closest to EU users

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT     = "3000"

[http_service]
  internal_port       = 3000
  force_https         = true
  auto_stop_machines  = true
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type       = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size       = "shared-cpu-1x"
  memory     = "512mb"

[checks]
  [checks.health]
    port     = 3000
    type     = "http"
    path     = "/api/health"
    interval = "30s"
    timeout  = "10s"

[[mounts]]
  source      = "studyai_data"
  destination = "/app/data"
  initial_size = "1gb"
