# ============================================================
#  StudyAI — Render deployment config
#  https://render.com/docs/render-yaml
# ============================================================

services:
  - type: web
    name: studyai
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: studyai-redis
          property: connectionString

  - type: redis
    name: studyai-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
