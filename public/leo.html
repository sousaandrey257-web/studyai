<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F1024" />
  <title>Ari · Atelier Cosmique · StudyAI</title>
  <meta name="description" content="Ari, ton compagnon d'études cosmique. Devoirs, examens, révisions — toutes les matières, tous les niveaux." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/leo.css?v=5" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
</head>
<body>

<!-- ── Cosmos background ───────────────────────────────────── -->
<div class="cosmos-stars" id="cosmos-stars" aria-hidden="true"></div>

<!-- ── Theme toggle ───────────────────────────────────────── -->
<button class="theme-toggle" id="theme-toggle" aria-label="Changer le thème (jour/nuit)">
  <span class="theme-icon">🌙</span>
</button>

<!-- ── Hidden file inputs at body root (browser security) ─── -->
<input type="file" id="ari-photo-input" accept="image/jpeg,image/png,image/webp,image/gif" hidden tabindex="-1" />
<input type="file" id="ari-file-input"  accept=".pdf,.txt,.md" hidden tabindex="-1" />

<!-- ══ APP SHELL ════════════════════════════════════════════ -->
<div class="ari-app" id="ari-app">

  <!-- ── HEADER ───────────────────────────────────────────── -->
  <header class="ari-header">
    <div class="ari-header-left">
      <button class="ari-sidebar-toggle" id="ari-sidebar-toggle" aria-label="Ouvrir/fermer l'historique">
        <span></span><span></span><span></span>
      </button>
      <a href="/" class="ari-back-link">← Accueil</a>
    </div>

    <div class="ari-identity">
      <div class="ari-avatar" aria-hidden="true">
        <div class="ari-glow"></div>
        <div class="ari-core">◈</div>
        <span class="ari-online-dot"></span>
      </div>
      <div>
        <div class="ari-name">Ari</div>
        <div class="ari-status">Compagnon d'études · En ligne</div>
      </div>
    </div>

    <div class="ari-header-right">
      <div class="ari-stat-pill" title="Expérience">⚡ <span id="ari-xp">0</span> XP</div>
      <div class="ari-stat-pill" title="Niveau">🏆 Niv. <span id="ari-level">1</span></div>
      <div class="ari-stat-pill" title="Streak">🔥 <span id="ari-streak">0</span></div>
    </div>
  </header>

  <!-- ── BODY : sidebar + main ────────────────────────────── -->
  <div class="ari-body">

    <!-- ── SIDEBAR HISTORIQUE ─────────────────────────────── -->
    <aside class="ari-sidebar" id="ari-sidebar" aria-label="Historique des conversations">
      <div class="ari-sidebar-inner">
        <button class="ari-new-conv-btn" id="ari-new-conv">
          <span aria-hidden="true">✦</span>
          Nouvelle conversation
        </button>

        <div class="ari-search-wrap">
          <input type="search" id="ari-search" class="ari-search-input"
                 placeholder="🔍 Rechercher…" aria-label="Rechercher dans l'historique" />
        </div>

        <div class="ari-history-list" id="ari-history-list" role="list"
             aria-label="Conversations précédentes">
          <!-- Rendered by JS -->
        </div>
      </div>
    </aside>

    <!-- Mobile sidebar overlay -->
    <div class="ari-sidebar-overlay" id="ari-sidebar-overlay"></div>

    <!-- ── MAIN ───────────────────────────────────────────── -->
    <div class="ari-main">

      <!-- Subject badge (shown when detected) -->
      <div class="ari-subject-bar" id="ari-subject-bar" hidden>
        <span class="ari-subject-tag" id="ari-subject-tag">📚 Matière</span>
        <span class="ari-subject-close" id="ari-subject-close" role="button"
              tabindex="0" aria-label="Fermer">✕</span>
      </div>

      <!-- Chat zone -->
      <main class="ari-chat" id="ari-chat" role="log"
            aria-live="polite" aria-label="Conversation avec Ari">
        <!-- Populated by JS -->
      </main>

      <!-- Scroll-to-bottom -->
      <button class="ari-scroll-btn" id="ari-scroll-btn" aria-label="Défiler en bas" hidden>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>

      <!-- Composer -->
      <footer class="ari-composer">
        <!-- Toolbar : outils d'artisan -->
        <div class="ari-toolbar">
          <button class="ari-tool" id="ari-voice-btn"
                  aria-label="Enregistrement vocal" title="Message vocal">
            <span aria-hidden="true">🎤</span>
            <span class="ari-tool-lbl">Vocal</span>
          </button>
          <button class="ari-tool" id="ari-photo-btn"
                  aria-label="Envoyer une image" title="Analyser une image">
            <span aria-hidden="true">📷</span>
            <span class="ari-tool-lbl">Image</span>
          </button>
          <button class="ari-tool" id="ari-file-btn"
                  aria-label="Envoyer un fichier" title="PDF ou fichier texte">
            <span aria-hidden="true">📎</span>
            <span class="ari-tool-lbl">Fichier</span>
          </button>

          <!-- Recording indicator -->
          <div class="ari-rec-indicator" id="ari-rec-indicator" hidden>
            <span class="ari-rec-dot" aria-hidden="true"></span>
            <span id="ari-rec-timer">0:00</span>
          </div>
        </div>

        <!-- Input row -->
        <div class="ari-input-row">
          <label for="ari-input" class="sr-only">Ta question pour Ari</label>
          <textarea id="ari-input" class="ari-input" rows="1"
                    placeholder="Pose ta question à Ari… (Entrée pour envoyer)"
                    aria-label="Message pour Ari"></textarea>
          <button id="ari-send" class="ari-send-btn" aria-label="Envoyer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>

        <p class="ari-hint">Shift+Entrée pour sauter une ligne · Drag &amp; drop un fichier ici</p>
      </footer>

    </div><!-- .ari-main -->
  </div><!-- .ari-body -->
</div><!-- .ari-app -->

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="/js/perf.js?v=1"></script>
<script src="/js/leo.js?v=5"></script>
</body>
</html>
