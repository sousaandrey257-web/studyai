<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A0A0F" />
  <title>Léo · Mon Tuteur · StudyAI</title>
  <meta name="description" content="Léo, ton tuteur IA personnel. Devoirs, examens, révisions — toutes les matières, tous les niveaux." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/css/leo.css?v=3" />
</head>
<body>

<!-- Hidden file inputs — outside any clickable area to avoid propagation issues -->
<input type="file" id="leo-photo-input" accept="image/jpeg,image/png,image/webp,image/gif" style="display:none" tabindex="-1" />
<input type="file" id="leo-file-input"  accept=".pdf,.txt,.md" style="display:none" tabindex="-1" />

<div class="leo-app" id="leo-app">

  <!-- ══ HEADER ══════════════════════════════════════════════ -->
  <header class="leo-header">
    <div class="leo-header-left">
      <button class="leo-sidebar-toggle" id="leo-sidebar-toggle" aria-label="Historique">
        <span></span><span></span><span></span>
      </button>
      <a href="/" class="leo-back-link">← Accueil</a>
    </div>

    <div class="leo-identity">
      <div class="leo-avatar" aria-hidden="true">
        <span class="leo-avatar-emoji">🤖</span>
        <span class="leo-online-dot"></span>
      </div>
      <div>
        <div class="leo-name">Léo</div>
        <div class="leo-status-text">Tuteur IA · En ligne</div>
      </div>
    </div>

    <div class="leo-header-right">
      <div class="leo-stat-pill" title="Expérience">
        <span aria-hidden="true">⚡</span>
        <span id="leo-xp">0</span> XP
      </div>
      <div class="leo-stat-pill" title="Niveau">
        <span aria-hidden="true">🏆</span>
        Niv. <span id="leo-level">1</span>
      </div>
      <div class="leo-stat-pill" title="Streak">
        <span aria-hidden="true">🔥</span>
        <span id="leo-streak">0</span>
      </div>
    </div>
  </header>

  <!-- ══ BODY : sidebar + main ════════════════════════════════ -->
  <div class="leo-body">

    <!-- ── SIDEBAR HISTORIQUE ────────────────────────────── -->
    <aside class="leo-sidebar" id="leo-sidebar" aria-label="Historique des conversations">
      <div class="leo-sidebar-inner">

        <button class="leo-new-conv-btn" id="leo-new-conv">
          <span aria-hidden="true">✦</span>
          Nouvelle conversation
        </button>

        <div class="leo-search-wrap">
          <input type="search" id="leo-search" class="leo-search-input"
                 placeholder="Rechercher…" aria-label="Rechercher dans l'historique" />
        </div>

        <div class="leo-history-list" id="leo-history-list" role="list"
             aria-label="Conversations précédentes">
          <!-- Rendered by JS -->
        </div>

      </div>
    </aside>

    <!-- Overlay for mobile sidebar -->
    <div class="leo-sidebar-overlay" id="leo-sidebar-overlay"></div>

    <!-- ── MAIN : chat + composer ────────────────────────── -->
    <div class="leo-main">

      <!-- Subject bar (hidden until detected) -->
      <div class="leo-subject-bar" id="leo-subject-bar" hidden>
        <span class="leo-subject-tag" id="leo-subject-tag">📚 Matière</span>
        <span class="leo-subject-close" id="leo-subject-close" role="button" tabindex="0" aria-label="Fermer">✕</span>
      </div>

      <!-- Chat messages -->
      <main class="leo-chat" id="leo-chat" role="log" aria-live="polite" aria-label="Conversation avec Léo">
        <!-- Welcome message injected by JS -->
      </main>

      <!-- Composer -->
      <footer class="leo-composer">

        <!-- Toolbar -->
        <div class="leo-toolbar">
          <button class="leo-tool-btn" id="leo-voice-btn"
                  title="Enregistrement vocal" aria-label="Enregistrement vocal">
            <span class="leo-tool-icon" aria-hidden="true">🎤</span>
            <span class="leo-tool-label">Vocal</span>
          </button>
          <button class="leo-tool-btn" id="leo-photo-btn"
                  title="Envoyer une image" aria-label="Envoyer une image">
            <span class="leo-tool-icon" aria-hidden="true">📷</span>
            <span class="leo-tool-label">Image</span>
          </button>
          <button class="leo-tool-btn" id="leo-file-btn"
                  title="Envoyer un PDF ou fichier" aria-label="Envoyer un fichier">
            <span class="leo-tool-icon" aria-hidden="true">📎</span>
            <span class="leo-tool-label">Fichier</span>
          </button>
          <div class="leo-toolbar-sep"></div>
          <div class="leo-recording-indicator" id="leo-recording-indicator" hidden>
            <span class="leo-rec-dot"></span>
            <span id="leo-rec-timer">0:00</span>
          </div>
        </div>

        <!-- Input row -->
        <div class="leo-input-row">
          <label for="leo-input" class="sr-only">Ta question pour Léo</label>
          <textarea id="leo-input" class="leo-input" rows="1"
                    placeholder="Pose ta question à Léo… (Entrée pour envoyer)"
                    aria-label="Message pour Léo"></textarea>
          <button id="leo-send" class="leo-send-btn" aria-label="Envoyer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>

        <div class="leo-composer-hint">
          Shift+Entrée pour sauter une ligne · Drag &amp; drop un fichier ici
        </div>
      </footer>

    </div><!-- .leo-main -->
  </div><!-- .leo-body -->
</div><!-- .leo-app -->

<script src="/js/perf.js?v=1"></script>
<script src="/js/leo.js?v=3"></script>
</body>
</html>
