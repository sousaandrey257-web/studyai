<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Réinitialiser le mot de passe — StudyAI</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .reset-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .reset-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 0 60px rgba(124,58,237,0.1);
    }
    .reset-logo { text-align: center; margin-bottom: 28px; }
    .reset-logo a { font-size: 1.4rem; font-weight: 800; text-decoration: none; background: linear-gradient(135deg,#c4b5fd,#7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .reset-title { font-size: 1.25rem; font-weight: 700; color: var(--text); letter-spacing: -0.02em; margin-bottom: 6px; }
    .reset-sub { font-size: 0.87rem; color: var(--text-subtle); margin-bottom: 28px; line-height: 1.6; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--text-muted); margin-bottom: 7px; }
    .form-input { width: 100%; padding: 11px 14px; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.9rem; color: var(--text); font-family: inherit; box-sizing: border-box; transition: border-color 0.15s; }
    .form-input:focus { outline: none; border-color: rgba(124,58,237,0.5); box-shadow: 0 0 0 3px rgba(124,58,237,0.12); }
    .btn-submit { width: 100%; padding: 13px; background: linear-gradient(135deg,#7c3aed,#6366f1); border: none; border-radius: var(--radius); font-size: 0.95rem; font-weight: 700; color: #fff; cursor: pointer; font-family: inherit; margin-top: 4px; transition: opacity 0.15s; }
    .btn-submit:hover { opacity: 0.9; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg { margin-top: 16px; padding: 12px 16px; border-radius: var(--radius); font-size: 0.85rem; line-height: 1.5; display: none; }
    .msg.success { background: var(--success-bg); border: 1px solid rgba(16,185,129,0.25); color: var(--success); border-left: 3px solid var(--success); display: block; }
    .msg.error { background: var(--error-bg); border: 1px solid rgba(239,68,68,0.25); color: #fca5a5; border-left: 3px solid var(--error); display: block; }
    .back-link { display: block; text-align: center; margin-top: 20px; font-size: 0.82rem; color: var(--text-subtle); text-decoration: none; }
    .back-link:hover { color: var(--primary-light); }
  </style>
</head>
<body>
  <div class="reset-wrap">
    <div class="reset-card">
      <div class="reset-logo"><a href="/">⚡ StudyAI</a></div>

      <!-- Step 1: Request reset -->
      <div id="step-request">
        <h1 class="reset-title">Mot de passe oublié ?</h1>
        <p class="reset-sub">Entrez votre email et nous vous enverrons un lien de réinitialisation.</p>
        <form id="form-request">
          <div class="form-group">
            <label class="form-label" for="email">Adresse email</label>
            <input class="form-input" type="email" id="email" placeholder="votre@email.com" required autocomplete="email" />
          </div>
          <button class="btn-submit" type="submit" id="btn-request">Envoyer le lien</button>
        </form>
        <div id="msg-request" class="msg"></div>
      </div>

      <!-- Step 2: Set new password (shown when token in URL) -->
      <div id="step-reset" style="display:none">
        <h1 class="reset-title">Nouveau mot de passe</h1>
        <p class="reset-sub">Choisissez un nouveau mot de passe sécurisé pour votre compte.</p>
        <form id="form-reset">
          <div class="form-group">
            <label class="form-label" for="new-password">Nouveau mot de passe</label>
            <input class="form-input" type="password" id="new-password" placeholder="Minimum 6 caractères" required minlength="6" autocomplete="new-password" />
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm-password">Confirmer le mot de passe</label>
            <input class="form-input" type="password" id="confirm-password" placeholder="Retapez votre mot de passe" required autocomplete="new-password" />
          </div>
          <button class="btn-submit" type="submit" id="btn-reset">Réinitialiser</button>
        </form>
        <div id="msg-reset" class="msg"></div>
      </div>

      <a href="/" class="back-link">← Retour à l'accueil</a>
    </div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var token  = params.get('token');

      if (token) {
        document.getElementById('step-request').style.display = 'none';
        document.getElementById('step-reset').style.display   = 'block';
      }

      // Step 1 — request reset link
      document.getElementById('form-request').addEventListener('submit', async function (e) {
        e.preventDefault();
        var btn = document.getElementById('btn-request');
        var msg = document.getElementById('msg-request');
        btn.disabled = true;
        btn.textContent = 'Envoi…';
        msg.className = 'msg';
        try {
          var res = await fetch('/api/auth/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: document.getElementById('email').value.trim() })
          });
          var data = await res.json();
          if (res.ok) {
            msg.className = 'msg success';
            msg.textContent = 'Si cet email existe, un lien de réinitialisation a été envoyé. Vérifiez votre boîte.';
            document.getElementById('form-request').style.display = 'none';
          } else {
            throw new Error(data.error || 'Erreur');
          }
        } catch (err) {
          msg.className = 'msg error';
          msg.textContent = err.message;
          btn.disabled = false;
          btn.textContent = 'Envoyer le lien';
        }
      });

      // Step 2 — set new password
      document.getElementById('form-reset').addEventListener('submit', async function (e) {
        e.preventDefault();
        var btn = document.getElementById('btn-reset');
        var msg = document.getElementById('msg-reset');
        var pw1 = document.getElementById('new-password').value;
        var pw2 = document.getElementById('confirm-password').value;
        if (pw1 !== pw2) {
          msg.className = 'msg error';
          msg.textContent = 'Les mots de passe ne correspondent pas.';
          return;
        }
        btn.disabled = true;
        btn.textContent = 'Réinitialisation…';
        msg.className = 'msg';
        try {
          var res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token, password: pw1 })
          });
          var data = await res.json();
          if (res.ok) {
            msg.className = 'msg success';
            msg.textContent = 'Mot de passe réinitialisé ! Redirection…';
            setTimeout(function () { location.href = '/'; }, 2000);
          } else {
            throw new Error(data.error || 'Erreur');
          }
        } catch (err) {
          msg.className = 'msg error';
          msg.textContent = err.message;
          btn.disabled = false;
          btn.textContent = 'Réinitialiser';
        }
      });
    })();
  </script>
</body>
</html>
